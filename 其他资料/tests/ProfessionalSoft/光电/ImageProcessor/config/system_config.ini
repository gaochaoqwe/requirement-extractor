# 图像处理系统配置文件

[camera]
width = 1920
height = 1080
fps = 30
format = RGB24

[processing]
max_features = 1000
quality_level = 0.01
min_distance = 10.0
use_harris = true

[display]
refresh_rate = 30
overlay_enabled = true

[system]
log_level = INFO
memory_pool_size = 67108864
max_threads = 4

[algorithms]
edge_threshold_low = 50
edge_threshold_high = 150
harris_k = 0.04
fast_threshold = 20

[performance]
enable_gpu_acceleration = false
max_processing_time_ms = 100
memory_limit_mb = 512 